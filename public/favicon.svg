<svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="glow" cx="50%" cy="40%" r="65%">
      <stop offset="0%" stop-color="#FF6B35" stop-opacity="0.55" />
      <stop offset="45%" stop-color="#FF4500" stop-opacity="0.18" />
      <stop offset="100%" stop-color="#FF4500" stop-opacity="0" />
    </radialGradient>
    <linearGradient id="ember" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FFB627" />
      <stop offset="55%" stop-color="#FF6B35" />
      <stop offset="100%" stop-color="#FF4500" />
    </linearGradient>
    <filter id="soft" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="6" />
    </filter>
  </defs>

  <!-- tile -->
  <rect x="2" y="2" width="508" height="508" rx="116" fill="#0a0604" />
  <rect x="2" y="2" width="508" height="508" rx="116" fill="url(#glow)" />
  <rect x="3.5" y="3.5" width="505" height="505" rx="114.5" fill="none"
        stroke="#FF6B35" stroke-opacity="0.28" stroke-width="3" />

  <!-- glow underlay -->
  <g filter="url(#soft)" opacity="0.9">
    <polyline points="182,150 304,256 182,362" fill="none" stroke="#FF4500"
              stroke-width="50" stroke-linecap="round" stroke-linejoin="round" />
    <rect x="300" y="320" width="132" height="46" rx="14" fill="#FF4500" />
  </g>

  <!-- prompt mark  >_ -->
  <polyline points="182,150 304,256 182,362" fill="none" stroke="url(#ember)"
            stroke-width="50" stroke-linecap="round" stroke-linejoin="round" />
  <rect x="300" y="320" width="132" height="46" rx="14" fill="url(#ember)" />
</svg>
